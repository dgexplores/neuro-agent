[pytest]
# Pytest configuration for acceptance testing

# Test discovery
testpaths = backend/tests/acceptance
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-bdd configuration
bdd_features_base_dir = backend/tests/acceptance/features

# Markers
markers =
    critical: Critical path tests (must pass for MVP)
    positive: Positive test cases (expected success)
    negative: Negative test cases (expected failure/error)
    validation: Input validation tests
    red_flag: Red flag symptom detection tests
    performance: Performance and SLA tests
    localization: Multi-language/i18n tests
    drug_interaction: Drug interaction checking tests
    parameterized: Parameterized test scenarios
    integration: Integration tests requiring external services
    slow: Slow running tests (>5 seconds)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --code-highlight=yes
    --junit-xml=reports/acceptance/junit.xml
    --html=reports/acceptance/report.html
    --self-contained-html

# Coverage options (if using pytest-cov)
# --cov=backend
# --cov-report=html:reports/acceptance/coverage
# --cov-report=term-missing

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if using pytest-timeout)
timeout = 30
timeout_method = thread

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.9
