name: Verify NeuroAgent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend-suites:
    runs-on: ubuntu-24.04
    container: python:3.11-slim
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit
            paths: backend/tests/unit backend/tests/test_neuro_agent.py
          - group: diagnosis-api
            paths: backend/tests/integration/test_api_diagnosis.py
          - group: drug-api
            paths: backend/tests/integration/test_api_drug_interactions.py
          - group: image-api
            paths: backend/tests/integration/test_api_image_analysis.py
          - group: acceptance
            paths: backend/tests/acceptance
          - group: adapters
            paths: tests/test_*.py
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned backend and test dependencies
        run: python -m pip install -r requirements-lambda.txt -r requirements-test.in
      - name: Verify ${{ matrix.group }} contracts
        timeout-minutes: 3
        run: |
          ulimit -c 0
          timeout --signal=TERM --kill-after=10s 90s \
            python -X faulthandler -m pytest -c pyproject.toml ${{ matrix.paths }} \
            -vv --capture=tee-sys --timeout=45 --timeout-method=thread \
            -o faulthandler_timeout=30 --junitxml=reports/backend-${{ matrix.group }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results-${{ matrix.group }}
          path: reports/backend-${{ matrix.group }}.xml
  backend-contracts:
    needs: backend-suites
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every backend suite to pass
        env:
          BACKEND_RESULT: ${{ needs.backend-suites.result }}
        run: test "$BACKEND_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-test-results-*
          merge-multiple: true
          path: reports
      - name: Verify all 181 distinct contracts ran without skips
        run: |
          python3 - <<'PYTEST_REPORT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'unit': 49, 'diagnosis-api': 15, 'drug-api': 15,
                      'image-api': 12, 'acceptance': 3, 'adapters': 87}
          identities = set()
          for group, count in expected.items():
              root = ET.parse(Path('reports') / f'backend-{group}.xml').getroot()
              cases = list(root.iter('testcase'))
              assert len(cases) == count, (group, len(cases), count)
              for case in cases:
                  assert all(case.find(tag) is None for tag in ('skipped', 'failure', 'error')), group
                  identity = (case.get('classname'), case.get('name'))
                  assert identity not in identities, identity
                  identities.add(identity)
          assert len(identities) == 181, len(identities)
          print('PASS: all 181 distinct backend contracts executed with no skips or failures.')
          PYTEST_REPORT
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neuroagent:${{ github.sha }}
      - name: Verify packaged backend health endpoint without AWS calls
        run: >-
          docker run --rm --entrypoint python
          -e AWS_EC2_METADATA_DISABLED=true -e AWS_ACCESS_KEY_ID=testing
          -e AWS_SECRET_ACCESS_KEY=testing -e AWS_REGION=us-east-1
          -e JWT_SECRET_KEY=disposable-ci-only
          neuroagent:${{ github.sha }}
          -c 'from backend.main import app; from fastapi.testclient import TestClient; response=TestClient(app).get("/health"); assert response.status_code == 200; assert response.json()["services"]["bedrock"] == "not_checked"' 
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh Linux x86_64 Python 3.11 Lambda layer
        run: bash infrastructure/cdk-clean/build_layer.sh
      - name: Install infrastructure tools
        run: python -m pip install -r infrastructure/cdk-clean/requirements.txt
      - name: Synthesize and verify canonical AWS infrastructure
        run: python infrastructure/cdk-clean/verify_stack.py
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements-lambda.txt --no-deps --disable-pip
