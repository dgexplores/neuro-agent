name: Deploy verified NeuroAgent to Oracle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-demo-deploy
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  verify-oracle-container:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the nonroot Oracle ARM image
        run: docker build -f deploy/oracle/Dockerfile -t neuro-oracle:test .
      - name: Verify startup without cloud credentials or model requests
        run: |
          set -euo pipefail
          docker run --rm --read-only --tmpfs /tmp --mount type=volume,destination=/data --memory=512m --entrypoint python \
            -e MODEL_PROVIDER=gemini -e GEMINI_API_KEY=synthetic-ci-key-no-model-calls \
            -e GEMINI_MODEL=gemini-3.5-flash-lite -e JWT_SECRET_KEY=synthetic-ci-secret-not-a-deployed-key \
            -e ENV=production -e CASE_DB_PATH=/data/cases.sqlite3 -e DEMO_ACCESS_ENABLED=true \
            neuro-oracle:test -c 'import os; from backend.main import app; from backend.services.case_store import get_case_store; from fastapi.testclient import TestClient; assert os.getuid() == 10001; c=TestClient(app); assert c.get("/health").json()["services"]["gemini"] == "not_checked"; assert c.get("/api/v1/demo/config").json()["enabled"] is True; assert c.get("/api/v1/cases/missing").status_code == 401; s=get_case_store(); s.save("synthetic", {"case_id":"runtime-probe"}); assert s.get("synthetic", "runtime-probe")["case_id"] == "runtime-probe"; assert s.get("other", "runtime-probe") is None'
  deploy:
    needs: [verify, verify-oracle-container]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: oracle-demo
    timeout-minutes: 35
    env:
      DEPLOY_ENABLED: ${{ vars.ORACLE_DEPLOYMENT_ENABLED }}
      ORACLE_HOST: ${{ vars.ORACLE_HOST }}
      DEMO_HOSTNAME: ${{ vars.ORACLE_DEMO_HOSTNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require explicit deployment configuration
        run: |
          set -euo pipefail
          test "$DEPLOY_ENABLED" = true || { echo 'Oracle deployment is disabled'; exit 1; }
          [[ "$ORACLE_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$ ]]
          [[ "$DEMO_HOSTNAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$ ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend for the same HTTPS origin
        working-directory: frontend
        env:
          REACT_APP_API_URL: https://${{ vars.ORACLE_DEMO_HOSTNAME }}
        run: |
          npm ci
          npm run build
      - name: Package only the selected public revision and frontend build
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/neuro-release"
          mkdir -p "$package/frontend-static"
          git archive "$GITHUB_SHA" | tar -x -C "$package"
          cp -R frontend/build/. "$package/frontend-static/"
          printf '%s\n' "$GITHUB_SHA" > "$package/REVISION"
          tar -czf "$RUNNER_TEMP/neuro-$GITHUB_SHA.tgz" -C "$package" .
      - name: Configure pinned SSH access
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/neuro
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/neuro ~/.ssh/known_hosts
      - name: Upload and release on the existing Oracle host
        run: |
          set -euo pipefail
          scp -i ~/.ssh/neuro -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/neuro-$GITHUB_SHA.tgz" "ubuntu@$ORACLE_HOST:/opt/neuro/"
          ssh -i ~/.ssh/neuro -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$ORACLE_HOST" bash -s -- "$GITHUB_SHA" "$DEMO_HOSTNAME" < deploy/oracle/release.sh
      - name: Remove the temporary runner key
        if: always()
        run: rm -f ~/.ssh/neuro
