name: Guard CLAUDE.md
on:
  pull_request:
  push:
    branches: [ main, master ]
jobs:
  check-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify SHA256 of CLAUDE.md
        run: |
          test -f CLAUDE.md.sha256 || { echo "CLAUDE.md.sha256 缺失"; exit 1; }
          HASH=$(sha256sum CLAUDE.md | awk '{print $1}')
          REF=$(awk '{print $1}' CLAUDE.md.sha256)
          if [ "$HASH" != "$REF" ]; then
            echo "CLAUDE.md 與校驗值不一致，請執行 'make lock-claude' 後再提交。"
            exit 1
          fi
